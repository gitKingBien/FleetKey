name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile
        run: python -m py_compile app.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
